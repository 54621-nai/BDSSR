 #2阶段
 MCW_2nd_years: "又是一年来到"
 MCW_2nd_years_desc: "时间就如同损坏的钟表，停滞不前。一九四一年至今，布尔什维克们与游击队红军战士们奋战抗敌，时间将他们的眼泪一点一点风干，运用转换法将痛苦转为动力的法子已是见怪不怪。当我们的骨肉被痛苦所淬炼时，对于纳粹的仇恨已经化作对抗敌军最锋利的尖刀！\n纳粹企图剿灭游击队的补给线，以此来达到稳扎稳打、逐步歼灭的方式歼灭我们。可他们错了，他们自以为时间会消灭我们，然而，他们低估了红军的实力，更低估了德国本土内部的明征暗斗。岁末又至，长夜将尽。同志们，让我们共同迎接那必将到来的、属于我们的胜利！红军最强大！"
