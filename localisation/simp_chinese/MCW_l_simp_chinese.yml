 MCW_dummy_liberal_desc: "MCW_dummy_liberal_desc"
 MCW_dummy_communist: "清洗红色匪徒"
 MCW_dummy_communist_desc: "MCW_dummy_communist_desc"
 MCW_power_from_lit: "权柄来自膏血"
 MCW_power_from_lit_desc: "MCW_power_from_lit_desc"
 MCW_the_slave: "麦之首"
 MCW_the_slave_desc: "我们又一次完成对专员辖区内斯拉夫游击队的清剿、以及AA线以东那些劣等民族军阀的碾压之后，战事总算告一段落。那些躲在林子和沼泽里的老鼠已经被打得抬不起头来，东边的杂牌军也被我们的坦克履带碾碎。短时间内翻不起什么浪花了，在取得了这样的丰功伟绩之后，我们终于可以腾出手来，好好解决一下辖区里的经济问题。"
 MCW_good_report: "财报上的充盈"
 MCW_good_report_desc: "对于专员辖区的每一个官员来说，谎报数据早已算不上什么过失，甚至可以说是日常工作中最基本的习惯。上级对此也心照不宣只要递往日耳曼尼亚的报表上剔掉了那些碍眼的真实，大家的日子都好过。报表上的数字漂亮，政绩也就自然就到手了。至于底下到底是怎么回事，没人真的在意，反正他们也不在乎这个帝国边陲的破败地方。但真的如此吗？元首的缔造者，帝国的“博士”告诉我们：“为了德意志的每一寸疆土，每一个纳粹党员都要拿出十分的精力与二十分的干力。”\n理想如此，现实亦是如此……？我们，脚踏着日耳曼祖国未来的疆土，如今的妥协只是为了更好的前进，退一步进两步，才是约瑟夫•戈培尔博士与罗森伯格思想的精髓。"
 MCW_bad_reality: "现实中的压迫"
 MCW_bad_reality_desc: "在第三帝国伟大理论的指引下，这片土地上的每一个斯拉夫人，生来就是为了服侍他们的日耳曼主子。他们体内的每一滴血、每一块肉，都是专员辖区这台巨大绞肉机里的燃料，源源不断地燃烧自己，供养雅利安优等种族的生存与扩张。这就是他们唯一的宿命。\n那些劣等民族本该如此，可是趁着游击队像耗子一样四处作乱，再加上那些狡猾的合作者在背后煽风点火，这些低等民族竟一度染指了他们根本不配拥有的权力。他们以为自己逃出这个地狱，甚至妄想翻身。如今，游击队已被坦克碾成碎渣，合作者也已收拾干净，是时候跟他们好好算一算这笔账了。"
 MCW_small_cost: "代价微不足道"
 MCW_small_cost_desc: "MCW_small_cost_desc"
 MCW_glory_from_slavery: "荣光来自奴役"
 MCW_glory_from_slavery_desc: "MCW_glory_from_slavery_desc"
 MCW_the_army: "斧之首"
 MCW_the_army_desc: "在我们专员辖区强大武力的反复扫荡之下，那些斯拉夫游击队已经撑不了多久了。他们要么被就地歼灭，尸体埋在无人知晓的荒沟里；要么像受惊的耗子一样，缩进密林深处和沼泽地里，跟我们玩起了躲猫猫的把戏。但这不过是苟延残喘罢了。接下来我们要做的，就是收紧这张网，加强宣传攻势，瓦解他们的民心基础；同时加大军事行动的密度和范围，一寸一寸地压缩他们的生存空间。把他们从藏身处逼出来，赶出来，然后一个一个地清理干净。"
