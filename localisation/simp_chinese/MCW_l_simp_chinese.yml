l_simp_chinese:
 MCW_the_end_n_the_begin: "旧历新篇"
 MCW_the_end_n_the_begin_desc: "伴随着午夜的钟声，莫斯科专员辖区迎来1962年。\n\n二十年前，帝国军队轻易踏平了这片东欧最富饶的土地，将其建成雅利安人的乐土。斯拉夫人沦为奴隶，只有零星的游击队还在徒劳挣扎。\n\n后来，那群劣等民族竟从西俄罗斯杀了回来，虽然被帝国的武力碾碎，却留下了更大的烂摊子——漫山遍野的游击队，阳奉阴违的合作者，处处让人恶心。\n\n如今，日耳曼尼亚下了新指示：督促我们赶紧清剿完可恶的游击队。那些劣等民族活着的唯一意义，就是为雅利安主子服务。"
 MCW_report_works: "汇报工作"
 MCW_report_works_desc: "老实说在上一年里，我们其实没多大进展。那群该死的游击队跟耗子一样，几乎无处不在。他们扒铁路炸碉堡，把我们的基层建设搞得一塌糊涂，甚至时不时还会在城里面引爆两枚炸弹。\n不过也没事，我们只需要稍微的那么夸大一点我们的贡献，在报告上多加那么几个0，然后让日耳曼尼亚方面的官员，看到他们想要看到的东西就足够了，毕竟他们其实也不是那么的在乎我们的死活。"
 MCW_Intra-party_dissent: "党内异议不减..."
 MCW_Intra-party_dissent_desc: "莫斯科专员辖区的官员大致分成三股势力：党卫军一派、国防军一派，再加上外围那些俄罗斯合作者。卡舍身为最高专员，平日里最主要的差事就是在这两派之间端水，维持表面上的平衡。然而近来党卫军与国防军的矛盾愈演愈烈，会上吵得不可开交，好几次险些当场动手。会议室里的气氛一天比一天紧张，火药味浓得呛人。起初卡舍还耐着性子调和几句，各打五十大板，后来发现根本压不住。他索性懒得再管，每次开会便坐在主位上冷眼看着，由着他们吵，散会起身就走，一个字也懒得多说。"
 MCW_the_partisan_is_free: "...游击队逍遥法外..."
 MCW_the_partisan_is_free_desc: "真是不幸。莫斯科被我们占了整整二十年，那群游击队却跟耗子一样，怎么杀都杀不干净。越打压，他们反倒越顽强，跟踩不完的杂草似的，踩完一茬又长一茬。这帮劣等民族最近还切断了莫斯科与保卢斯堡之间的交通线，运输车队被困在半路上，补给送不过去。真是该死。看来，新一轮清剿是该动手准备了，不能再让他们这么嚣张下去。"
 MCW_strengthen_the_wall: "巩固边墙"
 MCW_strengthen_the_wall_desc: "在西俄罗斯战争结束后，专员辖区的边境就没消停过。边境线另一边，盘踞着大大小小的俄罗斯军阀有曾经跟我们合作过的变节者，有红军装甲部队的残部，也有纯粹的土匪强盗。这些人各怀心思，但在一点上出奇一致：隔三差五就来骚扰边界。驻守边界的多半是新兵，碰上他们，多半是营地被洗劫一空。没办法，我们只能从后方抽调更多人手和精良装备，去加固这条没完没了的防线。" 
 MCW_sneaky_collaborator: "...合作者心怀鬼胎"
 MCW_sneaky_collaborator_desc: "西俄罗斯战争结束后，为了稳住莫斯科这片地盘，防止那些劣等民族趁机闹事，我们不得不捏着鼻子扶了一批俄罗斯合作者——戈尔巴乔夫、卡明斯基，都是这类货色。他们确实好用，有他们在，统治斯拉夫人省了不少力气。但这些人各怀鬼胎，心里那点算盘我们都清楚。拴狗绳子一旦松了，保不准回头就要咬主人。所以，对这些人的态度必须慎之又慎，盯紧管牢半点马虎不得"
 MCW_make_a_deal: "事项谈拢"
 MCW_make_a_deal_desc: "德意志国防军一直是莫斯科专员辖区最核心的武装力量。无论镇压叛乱、清剿游击队，还是日常治安巡逻，都离不开国防军的身影。为了稳固统治，我们必须团结并提拔一批忠诚可靠的国防军军官，依靠他们维持辖区的基本秩序。同时，这也是制衡日益膨胀、行事愈发跋扈的党卫军的第一步棋。"
 MCW_open_a_back_door: "开个小道"
 MCW_open_a_back_door_desc: "在莫斯科的废墟上，劣等人的哀嚎不过是历史车轮碾过枯骨时的杂音。日耳曼尼亚的意志无需向这片冻土上的野蛮人证明什么，但为了更高效地榨取东方的资源，我们偶尔需要几条懂得摇尾的斯拉夫猎犬。\n东方不需要领袖，只需要服从。帝国，是这片蛮荒之地唯一的上帝。"
 MCW_strengthen_rural_management: "加强乡村管理"
 MCW_strengthen_rural_management_desc: "为了清剿那些该死的游击队，顺便压一压合作者们日渐膨胀的气焰，我们必须把准备工作做到位。基层士兵全部动员起来，新式武器尽快分发到每个人手上，军事训练也要抓紧射击、战术配合、野外拉练，一项都不能落下。弹药、燃料、补给物资，提前囤够三个月用量。各个驻防单位要随时处于待命状态，命令一下，立刻投入大规模扫荡，绝不给敌人留下一丝喘息的机会。"
 MCW_prepare_well: "做好万全准备"
 MCW_prepare_well_desc: "为了清剿那些该死的游击队，顺便压一压合作者们日渐膨胀的气焰，我们必须把准备工作做到位。基层士兵全部动员起来，新式武器尽快分发到每个人手上，军事训练也要抓紧射击、战术配合、野外拉练，一项都不能落下。弹药、燃料、补给物资，提前囤够三个月用量。各个驻防单位要随时处于待命状态，命令一下，立刻投入大规模扫荡，绝不给敌人留下一丝喘息的机会。"
 MCW_there_r_nets_everywhere: "布下天罗地网"
 MCW_there_r_nets_everywhere_desc: "清剿要想彻底，情报是必不可少的。这一点上，那些俄罗斯变节者还有最后一点价值可以榨取。通过情报部门与他们合作，我们可以把眼线渗透到每一个村庄、每一条小路里去。只要他们还想活命，就得乖乖替我们盯紧游击队的动向。一张情报网撒下去，哪个村子进了陌生人、哪片林子夜里有人走动、谁家在偷偷藏粮食都会有人报上来。这样一来，游击队的一举一动就全在我们的眼皮底下了。"
 MCW_kill_them: "扼杀他们"
 MCW_kill_them_desc: "帝国千秋而万代，一个高等民族都对于这种千秋有着必要的使命和义务。如果要说专员辖区的使命是什么，是为了个人私利吗？不！他是为了整个日耳曼民族的。因此，每个辖区的官员都应该拿出服从元首、服从祖国的崇高意识。如今，情报工作与军事训练虽说拿不出十拿九稳的功夫。东方理论作为党的“大理论家”罗森伯格的重要成果，我们不可避免的不能忽视恢复，为了让东方成为帝国的新边疆，以至于恢复往日帝国明珠的实体，总而言之，莫斯科维恩现今的任务就是“恢复到一九五五年的边界”的巨大任务，而这项任务的前提条件就是，使内部的劣等民族游击队销声匿迹，现在，是时候切断那群游击队了！\n我们将在以后恢复1955年之边界。任何干扰这一宏伟目标的因素，都必须从帝国的新边疆中铲除！针对劣等民族游击队的剿灭行动，必须执行！"
 MCW_the_operation_sweeper: "清道夫行动"
 MCW_the_operation_sweeper_desc: "若有人问起，这专员辖区究竟为何而存？难道仅仅是为了成全某些人的私欲？\n身居此地的每一位官员，都必须把对元首的服从、对祖国的忠诚，刻进骨子里，化作最纯粹的意志。我不否认，眼下我们辖区的军队在情报和操练上，确实还有些不够稳妥。但罗森伯格当年奠定的“东方理论”，我们一刻也不能忘。我们要做的，是把这片广袤的东方，真正铺成帝国崭新的边疆，让昔日那些失落的帝国明珠，重新回到我们的版图之中。说到底，莫斯科维恩的总方针只有一个，那就是：不惜一切代价，恢复到一九五五年的边界。而要实现这个宏愿，有一个绕不开的前提——那些盘踞在境内的劣等民族游击队，必须彻底销声匿迹。现在，就是该下狠手，彻底掐断这群残党最后生路的时候了"
 MCW_Vologda: "中立者"
 MCW_Vologda_desc: "瓦西里·伊万诺夫，中立区之雄狮。西俄战争期间，其麾下之部众，乃是帝国国防军无法挺进至1955年旧疆之界的关键阻力。其军阀政权苟存于革命阵线与专员辖区的夹缝之中，恰好印证了罗斯的名言所云：“俄罗斯很大，没有一处是属于和平的。”\n此刻，实践已至。行动开始，碾碎他们那贱奴般的的“和平”！"
 MCW_groky: "坚守者"
 MCW_groky_desc: "切尔尼亚霍夫斯基，布尔什维克-犹太的能征善战之人，他的部队可谓是传奇，其麾下之装甲核心，在面临合作者与帝国正规军的双重包围下，数次打退并反包围了我军，给我军带来了不小的损失。因此，他也作为顽固攻击帝国军队的重要人物，被许多国防军高官称之为“俄军后期才干最强之人。”\n很遗憾的是，所谓的先驱——犹太贱人，他们心心念念的犹太-布尔什维主义终将抛弃他们，他们亦永远回不到故乡，帝国军队的子弹将会终结他们的生命，直到命丧金属坟墓之中！"
 MCW_samara: "背叛者"
 MCW_samara_desc: "如果要论罗斯兰人最莫过于奸诈狡诈之徒，前犹太-布尔什维克出身的安德烈•弗拉索夫无非是莫过于出镜的。身为三姓家奴的他，背叛了他的罗斯兰祖国、背叛了犹太-布尔什维克，最后又背叛了帝国给予其厚望的机会。现在，是时候惩戒一下过去的贱狗了。\n帝国的权威不容置疑，三姓家奴必败于德意志祖国铁骑之下！"
 MCW_go_back_home: "班师回朝"
 MCW_go_back_home_desc: "MCW_go_back_home_desc"
 MCW_drive_Gorinich: "驾驭戈里内奇"
 MCW_drive_Gorinich_desc: "MCW_drive_Gorinich_desc"
 MCW_the_gover: "角之首"
 MCW_the_gover_desc: "专员辖区内部从来就不是铁板一块。党卫军、国防军、俄罗斯合作者三方势力各怀鬼胎，表面上听从指挥，背地里都有自己的算盘。以前为了对付那些劣等民族，顾不上跟他们计较，暂且容他们蹦跶几日。如今战事暂歇，，也该腾出手来，好好跟这些心怀二意的人算算账了。凡是暗中伸手、两面三刀的之人一个都不会放过。专员的意志不容试探，辖区的秩序不容动摇。"
