MCW_joker: "盖洛伊木马"
MCW_joker_desc: ""
MCW_ghost: "苏维埃的幽灵"
MCW_ghost_desc: "对于每一个在专员辖区新秩序下苟活的斯拉夫人来说，苏维埃社会主义联盟始终是一个遥不可及的故国。他们中的许多人，甚至从一出生就落在了这片被德意志铁蹄踏平的噩梦里，从未亲眼见过那个红色的旗帜。但这并不妨碍他们对苏维埃的怀念，这种感情就像孩子与母亲一样，永远无法分割。\n\n在苏维埃解体的20载之前，在西俄罗斯战争的硝烟散去5年之后，在雅利安人统治下从工厂流水线上戴着镣铐的奴隶，到森林深处啃着冷面包的游击队；从保卢斯堡的工人宿舍，到莫斯科维恩郊外的贫民窟——苏维埃的影子无处不在。它活在老人的回忆里，活在母亲的歌谣里，活在被禁的书页和地下的传单里。它像一场永远不会醒来的梦魇，缠绕着专员辖区的每一寸土地、每一个夜晚"
MCW_bad_logistics: "瘫痪的补给线"
MCW_bad_logistics_desc: "补给线是战争中最敏感的神经，帝国在东方的统治亦是一场伟大的战争。而在这片广袤的东方冻地上，我们的铁路网正遭到无休止的破坏。当连一列来自日耳曼尼亚的火车都无法安全通行时，我们的秩序就将不再绝对了。在无尽的清剿与修复中，我们的后勤正承受着日益沉重的代价。"
MCW_Wehrmacht_SS: "安斐斯比那"
MCW_Wehrmacht_SS_desc: "莫斯科维恩专员辖区内，主要盘踞着两支武装力量。一支是以绍肯将军为首的国防军，他们是辖区最核心的作战支柱，承担着大规模镇压、边疆守备和围剿游击队的重任。另一支则是恶贯满盈的莫斯科党卫军别动队。这群从普莱斯考监狱里拉出来的罪犯，是整个莫斯科维恩最血腥、最暴力、最不讲人性的武装。他们专司大规模处决、种族净化之类的脏活，也时常下乡清剿，充当专员手底下最好使的一副黑手套。\n\n国防军瞧不上党卫军，觉得他们不过是一群装腔作势、投机倒把的杀人狂，打起仗来毫无章法，只会欺负手无寸铁的平民。党卫军同样看不起国防军，嫌他们不够纯粹，为了凑数竞不惜招募那些俄罗斯变节者入伍，玷污了雅利安军人的体面。即使西俄罗斯战争已结束多年，两派人马的冲突却从未停止。他们站在同一面旗帜下，却对彼此怀着刻骨铭心的仇恨都在等一个机会，一个有朝一日能让对方永无翻身之地的机会。"
MCW_fearness: "人心惶惶"
MCW_fearness_desc: "对于专员辖区的高级官员来说，莫斯科维恩实在是一片不幸之地。若非彻头彻尾的纳粹暴徒，便是那些犯下过失或被元首冷落在一旁的失意之人，才会被发配到这帝国破败的东方边陲。到了这里，就别再指望什么晋升了这辈子大抵也就这样了，能在任上平安终老已是最大的奢望。\n\n而对于那些被宣传机器蛊惑而来的德国移民和下层官僚而言，莫斯科维恩则是一场彻头彻尾的骗局。帝国本土的海报和广播把这里描绘成雅利安人的应许之地宏伟的东方总计划、肥沃的黑土平原、崭新的田园生活。可真到了地方才发现，迎接他们的是无尽的泥泞、严寒、游击队袭扰，以及比宣传画上黯淡一百倍的现实。若有得选，他们宁愿一辈子待在东方领地或乌克兰，至少那里的日子比这个鬼地方强得多。\n\n至于斯拉夫人对他们来说，专员辖区就是一个本不该存在于世上的人间炼狱。成年的男女被驱赶进工厂和矿场，一天二十四小时为帝国劳役，换来的却是每日不过四百大卡的残羹剩饭，勉强吊着一口气不被饿死。与其在这里慢慢熬成一副骨架，他们宁愿豁出身家性命，成群结队地逃进森林，投奔游击队。死在枪口下，也比死在流水线上强。"