WRS_main_story.0.t: "奇怪的信号"
WRS_main_story.0.d: "地下室又潮又冷，墙皮剥落了一大片，露出里面的红砖。头顶一盏裸灯泡晃晃悠悠，光线昏黄，照着桌上那台旧电台。报务员是个三十出头的男人，瘦长脸，颧骨很高，耳机扣在脑袋上，左手扶着旋钮慢慢扫频。\n\n静电噪音像潮水一样在耳朵里涨落。他扫了大半个钟头，脖子酸了，点了一根烟叼在嘴里，正准备换个波段，旋钮转过某个刻度的时候，杂音里忽然冒出一串信号短促，干净，有规律。他手指一顿，把旋钮往回拧了半格，信号清晰了一些。他听了几秒钟，眉头拧起来，腾出一只手在纸上飞快地记了几笔。\n\n记完了，他摘下耳机，盯着那串编码看了半天，又翻出桌上那本破旧的对照表对了对，越看越糊涂。他朝角落里喊了一声：“班长，过来看看这个。”\n\n墙角堆着几只弹药箱，上面铺了一件军大衣，一个五十来岁的老兵正靠着墙打盹。被叫醒后揉了揉眼睛，咳嗽了两声，慢吞吞地走过来，接过耳机扣上，眯着眼睛听了一会儿。\n\n起初没什么表情，听了几遍之后，眉头慢慢皱起来，又慢慢松开。他没有说话，把耳机摘下来，拿起桌上那张纸，看了很久。\n\n报务员等得不耐烦了：“班长，到底什么东西？我怎么对不上号。”老兵没接话，从兜里摸出一包压扁的烟，抽出一根点上，吸了一口，才开口说话。声音有点哑，像嗓子眼里卡着什么东西。\n\n“这是阵线的旧编码。”报务员愣了：“什么？”\n\n“阵线的旧代码。”老兵又说了一遍，手指在纸上那串数字上点了点，“战争的时候用的，战后就停用了。你没见过正常，这东西至少五六年没在空中出现过了。”\n\n他突然想到了什么，随后把烟灰弹在地上。"
WRS_main_story.0.a: "快让人去把元帅请过来。"

WRS_main_story.1.t: "初次通信"
WRS_main_story.1.d: "消息是在傍晚时分转到梅德韦杰夫手里的。译电员从地下室跑上来，手里攥着一张纸条，气喘吁吁地说：“司令员同志，联系上了。”\n\n梅德韦杰夫正蹲在篝火边上烤一块黑面包，闻言抬起头，没接纸条，先问了一句：“谁？”\n\n“西俄罗斯革命阵线。叶戈罗夫元帅本人。”\n\n梅德韦杰夫的动作停了一瞬。他把面包搁在铁皮饭盒盖上，站起来，在裤子上擦了擦手，接过纸条就着火光看了一遍。纸条上的字很短，是手抄的译文，末尾附了一组时间和频率。他没有立刻说话，盯着纸条看了很久，像是在确认那几个字是不是真的。然后他把纸条叠好，揣进上衣口袋，转身走进了通讯班的帐篷。\n\n帐篷里，报务员已经把频率调好，耳机挂在脖子上，见他进来便让出了座位。梅德韦杰夫坐下来，戴上耳机，调整了一下话筒的位置，深吸了一口气，按下通话键。\n\n“西俄罗斯革命阵线，西俄罗斯革命阵线，这里是莫斯科游击队指挥部，我是梅德韦杰夫。收到请回答。”\n\n电流声滋滋啦啦地响了几秒钟。然后耳机里传来一个声音——不算年轻，带着明显的俄国南部口音，语速不快，每个字都咬得很清楚。\n\n“梅德韦杰夫同志，你好。我是叶戈罗夫。”\n\n梅德韦杰夫握着话筒的手紧了紧。他听过这个声音，那是很多年前的事了，隔着广播电台的喇叭，隔着几千公里的战线，隔着一段几乎被埋葬的历史。如今这个声音又从电流的另一端浮了上来，苍老了一些，但那股子沉稳的劲儿还在。\n\n“元帅同志，”他说，嗓音有点发干，“我们以为你们已经不在了。”\n\n对面沉默了片刻。然后叶戈罗夫的声音再次响起，平静，带着一丝不易察觉的疲惫：“还在，虽然情况很艰难，但我们仍然没有放弃战斗。”\n\n他顿了顿，又问了一句：“你们那边怎么样？”\n\n梅德韦杰夫看了一眼帐篷外面渐渐暗下来的天色，远处隐约传来几声零星的枪响，像有人在远处敲着一面破鼓。他收回视线，低头盯着桌面上那道被烟头烫出的焦痕，说了一句：“我们仍在抵抗。”\n\n耳机里传来一声很轻的笑，像是松了一口气，又像是对这个答案早有预料。\n\n“那就好。”叶戈罗夫说，"
WRS_main_story.1.a: "“我们慢慢谈。”"