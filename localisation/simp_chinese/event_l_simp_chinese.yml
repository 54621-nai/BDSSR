MCW_main_story.1.t: "庆贺新年"
MCW_main_story.1.d: "莫斯科的冬天亮得很晚。早上七点，专员卡舍的办公室已经亮起了灯。他坐在宽大的办公桌后面，面前摆着一份简单的早餐黑面包、黄油、一杯热茶。这时秘书推门进来，手里捧着厚厚一沓文件。\n\n“专员先生，这是本周的工作简报。”\n\n卡舍嚼着面包点了点头，示意他念。秘书清了清嗓子：“第47号堡垒区提前竣工，比计划快了十二天；第三清剿大队在普里皮亚季沼泽地带击毙游击队一百三十余人……”\n\n数字一个接一个往外蹦，卡舍慢慢喝着茶，眼睛盯着窗外灰蒙蒙的天际线。他知道那些堡垒有几座连地基都没打完，知道所谓的战果里掺了平民的尸体，也知道这种事情不是一次两次了。但他什么都没说，只是偶尔点点头。\n\n吃完最后一块面包，他用餐巾擦了擦手，站起身来。秘书赶紧收起文件，递上大衣和帽子。楼下，黑色的霍希轿车已经发动引擎，排气管在冷空气里吐着白雾。子。楼下，黑色的霍希轿车已经发动引擎，排气管在冷空气里吐着白雾。司机拉开车门，卡舍弯腰坐进去，靠在真皮座椅上闭了眼。\n\n车子驶过积雪的街道，路边挂满了红底黑字的横幅“胜利属于德意志”“希特勒万岁”。广场上搭好了主席台，乐队正在调试乐器，一群穿着崭新制服的官员已经列队等候。远处，几缕黑烟从城郊的方向升起来，分不清是炊火还是别的什么。\n\n卡舍整了整领带，车子缓缓停稳。车门打开的瞬间，掌声和军乐一齐涌了进来。"
MCW_main_story.1.a: "伟大的卡舍万岁！"

MCW_main_story.2.t: "梅德韦杰夫的一天"
MCW_main_story.2.d: "梅德韦杰夫站在电台麦克风前。灯罩上积了一层灰，桌角放着半杯凉掉的茶。技术员冲他点头，信号通了。\n\n他开口，声音沙哑，语速不快。“同志们，乡亲们。新年好。”没有稿子，想到哪说到哪。说这一年又死了不少人，说冬天很难熬，说德国人以为春天能把他们赶尽杀绝。末了他顿了一下，“德国人想打多久，我们就跟他们打多久只要他们一天不走，我们也就一天不走！。”\n\n说完，关麦，披上大衣就走。门外吉普车没熄火，排气管突突冒着黑烟。司机问去哪，他说北线。\n\nn路很差。积雪被炮弹翻过好几轮，冻成硬疙瘩，车轮碾上去一跳一跳的。开了快俩小时，炮声越来越近。到了前沿，车停在一截烧焦的树桩旁边，他跳下来，踩着泥泞往战壕里走。\n\n战壕里的人不多，十几个，分散趴在射击位后面。有人认出他，愣了一瞬，咧嘴笑了一下，露出冻裂的嘴唇。他蹲下来，拍拍那人的肩膀，问冷不冷，那人说不冷，牙关却在打颤。他从兜里掏出一包烟，挨个散了一圈。有人划火柴，手抖了几下才点着。\n\n有人摸出半瓶伏特加，拧开盖子递过来。梅德韦杰夫接过去喝了一口，烈酒顺着喉咙烧进胃里。他把瓶子传回去，靠着土墙坐下来。远处炮火断断续续，照亮了雪地上横七竖八的铁丝网和弹坑。有人哼起歌来，调子跑了一半就停了，被下一轮炮声盖过去。\n\n他坐在那儿，没说话。头顶是炸裂的夜空，身边是一群满身泥泞的人。这就是他的新年。\n\n突然，一个士兵转过头问他：“元帅同志，火还没灭，您也要来根烟吗？”\n梅德韦杰夫笑了："
MCW_main_story.2.a: "“好啊，我可是老烟枪！”"

MCW_main_story.3.t: "一封报告"
MCW_main_story.3.d: "“致元首及日耳曼尼亚民族社会主义工人党总部：\n\n值此新年之际，我谨代表莫斯科专员辖区全体德意志公民及工作人员，向您致以最崇高、最忠诚的问候。\n\n过去一年，在本辖区全体同仁的不懈奋斗下，莫斯科的面貌正发生着日新月异的改变。治安形势持续向好，游击队残余势力已被压缩至偏远林区，其破坏能力已不足为虑。农业方面，尽管气候条件恶劣，但在科学的统筹调度下，粮食供应基本满足了辖区运转需求。工业重建也已提上日程，数座关键设施的修复工程正在稳步推进……\n\n这一切成果的取得，首先应当归功于元首您的远见卓识与钢铁般的意志。正是因为有您高瞻远瞩的战略布局，帝国才能在东方广袤的土地上站稳脚跟。您所倡导的民族精神与奋斗信念，始终是本辖区每一位工作人员的行动指南。每当我们面对困难与挑战时，只要想起元首您在纽伦堡集会上的铿锵话语，心中便充满了力量与勇气。毫不夸张地说，您不仅是德意志民族的领路人，更是整个欧洲文明世界的灯塔。莫斯科专员辖区的每一寸进步，都深深镌刻着您的名字。\n\n“我们坚信，在您的统帅下，帝国的东方疆域必将成为永不陷落的堡垒，成为子孙后代繁衍生息的永恒家园。莫斯科的每一寸土地，都将铭记帝国的恩泽。每一个生活在这片土地上的德意志人，都因身为雅利安民族的一员而倍感自豪。”"
MCW_main_story.3.a: "“向全体日尔曼人与劣等斯拉夫人的元首致敬”"

MCW_main_story.4.t: "一个游击队员的死"
MCW_main_story.4.d: "战斗在傍晚时分结束了。\n\n打扫战场的人在一段坍塌的矮墙后面找到了他。是个半大孩子，十五六岁的样子，脸上还带着没褪干净的稚气。枪扔在两步远的地方，弹匣打空了。胸口两个弹孔，血已经流干，在军服上凝成暗褐色的硬块。眼睛还睁着，望着灰蒙蒙的天。\n\n没人知道他叫什么。他是跟着另一支队伍来的，打散了，就一个人守在这截墙后面。搜出来的东西很少：半块黑面包，一颗没拉环的手榴弹，口袋里一张皱巴巴的照片，看不清上面是谁。\n\n几个人把他抬到林子边上，用刺刀在冻土上刨了个坑。土冻得太硬，只挖下去不到一米深就停了。有人扯了件破大衣铺在坑底，把他放进去，又把那张照片塞回他胸前的口袋里。填土的时候没人说话，只有铁锹铲土的闷响。\n\n坟堆得很小，没有十字架，也没有名字。一个老战士在坟前蹲下来，从兜里摸出一根烟，划了三次火柴才点着。他吸了一口，烟雾在冷空气里散开。他看着那座无名的土堆，看了很久，没说一句话。烟燃尽了，他把烟头摁进雪里，站起身，转身跟上了队伍。"
MCW_main_story.4.a: "新秩序下凄惨的骸骨......"

MCW_main_story.5.t: "踢皮球"
MCW_main_story.5.d: "今天是个难得的好日子，莫斯科终于从连日阴郁的冷雨中彻底解放出来。昨夜，随着“卡明斯基”旅最后一个连在红场上被悉数歼灭，这座历经内战摧残的城市终于迎来了久违的晨曦。第二天清晨，梅德韦杰夫按捺不住内心的激动，迫不及待地带着指挥部和警卫团，兴冲冲地驶入了莫斯科的街头。街头的幸存者们正相互拍着肩膀道喜，庆幸自己终于熬过了这段宛如地狱般的岁月。尽管没有张灯结彩与敲锣打鼓的喧嚣，但在浓烈的血腥味中，依然弥漫着一种令人陶醉的、劫后余生的喜悦。\n\n“去红场。”梅德韦杰夫大手一挥，打算去故地重游一番。然而，车子刚开出不久，就被一群不速之客拦停在了路中央。\n\n“霍，游击队来了？”有人打趣道。\n\n“这就叫游击队？也不咋地啊。”同伴忍不住吐槽。\n\n的确，这支队伍连件统一的行头都凑不齐。大部分人身上套着缴获的德军制服，却把帽徽抠得干干净净，仅在右臂上胡乱缠根红布条来区分敌我，活像一群刚拼凑起来的杂牌军。\n\n“我看还是德国人心善，”有人调侃道，“但凡再拖上一个月，你看这帮家伙还能剩下几块完整的布料？”\n\n“就是就是，一帮鼻孔朝天的家伙，现在还不是得给咱们当保安。”\n\n当这群“杂牌军”押着他们往家走，并像模像样地从他们家中搜出几支老掉牙的旧毛瑟步枪和ROA臂章时，梅德韦杰夫转过头，冲着身旁的马谢罗夫咧开嘴，露出了一个意味深长的坏笑。"
MCW_main_story.5.a: "“看来全莫斯科最好的皮球今天让我们包圆了”"

MCW_main_story.6.t: "换防"
MCW_main_story.6.d: "土路被前两天化雪泡软了，卡车轮胎碾过去，留下两道深深的车辙。车厢里挤着十几个换防下来的新兵，抱着枪缩成一团，没人说话。有人靠在挡板上打瞌睡，脑袋随着车身摇晃一颠一颠的。\n\n远处传来一阵低沉的轰鸣声，像地面在发抖。司机骂了一声，把车往路边靠。新兵们抬起头，迷迷糊糊地朝前方张望。\n\n先是烟尘。黄褐色的尘土从路那头卷起来，遮住了半边天空。紧接着第一辆坦克从尘雾里钻了出来，炮管指向正前方，履带哗啦哗啦地碾过泥泞的路面，把冻硬的土块轧得粉碎。后面跟着第二辆、第三辆，一辆接一辆，像一条铁灰色的河流，缓慢而不可阻挡地向前涌动。\n\n车厢里的新兵们都醒了。有人直起身子，有人把下巴搁在挡板边缘，呆呆地看着这支钢铁队伍从眼前经过。坦克上的士兵裹着脏兮兮的夹克，脸上糊着油污和尘土，眼神空空的，扫过路边这些年轻面孔时没有任何表情。\n\n一辆敞篷指挥车开过去，车斗里坐着几个军官，地图摊在膝盖上，正低头说着什么。随后是满载弹药的卡车，拖拽着重型火炮的牵引车，一辆油罐车，又是一排坦克。\n\n有个新兵低声说了句什么，没人听清。旁边的人没应声，只是盯着那些不断滚动的履带，看着它们把路上的泥浆和碎石一遍遍碾平。\n\n最后一辆车过去了，尘土慢慢落下来。卡车重新发动，颠簸着拐回路中央。新兵们重新缩回各自的位置，但没人再打瞌睡了。有人回头看了一眼，那些坦克已经变成远处移动的黑点，正朝着炮声传来的方向，不紧不慢地开过去。"
MCW_main_story.6.a: "莫斯科的大地在震动..."

MCW_main_story.7.t: "一场会议"
MCW_main_story.7.d: "会议室里烟雾缭绕，长桌两侧坐满了人。党卫军代表靠在椅背上，手指敲着桌面，国防军代表双手抱胸，脸色阴沉。两人已经吵了快半个小时。\n\n“你们国防军就是软骨头，早该把那几个村子烧光，就不会有后来的游击队报复——”\n\n“你少放屁。你们党卫军就知道杀人，杀完人拍拍屁股走了，烂摊子全是我们来收拾。上次要不是你们乱来，补给线根本不会被切断——”\n\n“够了。”\n\n卡舍坐在主位上，面前的茶杯已经凉透了。他脸上的肌肉绷得紧紧的，颧骨上方泛着不正常的潮红。两个人没理他，继续吵。\n\n“你们那套办法根本没用——”\n\n“你说什么？”\n\n“我说你们党卫军就是一帮——”\n\n卡舍抓起桌上的搪瓷茶杯，狠狠砸在地上。茶水溅了一地，碎瓷片弹到墙角。所有人都安静了。\n\n他站起来，双手撑着桌面，身体前倾，目光从党卫军代表脸上扫到国防军代表脸上，一字一顿地说：“你们两个，给我滚出去。”\n\n两人愣了一下，谁都没动。\n\n“滚！”\n\n椅子刮过地板的声音在寂静中格外刺耳。两人拿起帽子，一前一后走出会议室。门在他们身后关上，咔嗒一声。卡舍重新坐下，揉了揉太阳穴，看着桌上摊开的地图和报表，沉默了很久。"
MCW_main_story.7.a: "“这群代表们就他妈的该枪毙！”"

MCW_main_story.8.t: "戈尔巴乔夫与卡舍的谈话"
MCW_main_story.8.d: "事情来得毫无征兆。\n\n那天下午，戈尔巴乔夫正在办公室里整理文件，门被推开，两个穿黑色制服的人走进来，面无表情地站在门口。其中一人朝他抬了抬下巴：“专员要见你。”\n\n他心里咯噔一下，但脸上没敢露出什么，放下笔，站起来，跟着他们走。一路上没人说话，走廊里只有靴子踩在地板上的声响。他被带进那间熟悉的办公室——卡舍的房间。\n\n卡舍坐在办公桌后面，手里转着一支钢笔，面前摊着一份文件。他没有抬头，只是用下巴指了指前面的空地。两个随从退了出去，关上门。\n\n戈尔巴乔夫站在原地，手心已经开始冒汗。他不知道卡舍掌握了什么，但直觉告诉他，今天这趟没那么容易过关。\n\n卡舍放下笔，站起来，绕过办公桌，走到他面前。没有质问，没有怒吼，只是一脚踹在他小腹上。\n\n戈尔巴乔夫弓着腰后退几步，撞上书架，几本书掉下来砸在他肩上。他捂着肚子，喘不上气，额头上的冷汗一下子冒了出来。他咬着牙没喊出声，慢慢滑坐到地上。\n\n卡舍居高临下看着他，语气平静得像在聊天气：“你是不是觉得自己很聪明？”\n\n戈尔巴乔夫抬起头，脸色煞白，嘴唇翕动着，脑子里飞快地转着。他不确定卡舍知道了多少，但他知道这时候绝不能承认任何事。他扶着书架爬起来，跪在地上，声音发颤：“专员……我不知道您在说什么……我一直在老老实实做事，从来没有……”\n\n卡舍没接话，只是低头看着他，目光像刀子一样剜在他脸上。沉默持续了十几秒，每一秒都像一小时那么长。\n\n戈尔巴乔夫额头的汗滴落在地板上。他咽了口唾沫，声音更低了一些，带着哀求的语气：“专员，如果您对我有什么不放心……我愿意接受任何安排。降职也好，调走也好，去哪里都行。伏尔加格勒那边不是一直缺人手吗？我去那里，当个小差事，绝不给您添麻烦。”\n\n他说完，低着头，不敢看卡舍的眼睛。房间里只剩下墙上挂钟的滴答声。\n\n卡舍盯着他看了很久，最后转过身，走回办公桌后面坐下，重新拿起那份文件，头也不抬地说了一句：“明天就去报到。别让我再看见你。”\n\n戈尔巴乔夫走出了办公室，心里下定了决心："
MCW_main_story.9.a: "“是时候联系他们来赎罪了。”"

MCW_main_story.9.t: "卡舍的日记"
MCW_main_story.9.d: "今天，我终于把戈尔巴乔夫那个不知天高地厚的斯拉夫杂种降职了。他以为凭借几句虚伪的阿谀奉承，就能在雅利安人的殿堂里谋取一席之地？简直是痴人说梦。他骨子里的斯拉夫劣根性注定了他永远只能是一条看门狗，而不配坐在主人的餐桌旁。\n\n日耳曼尼亚的那群蠢货还在为一些毫无意义的琐事扯皮。国防军和党卫军的杂种们把精力全耗在了无休止的内斗上，仿佛这片冻土上的秩序全靠他们那点可怜的虚荣心来维系。既然这些高贵的容克老爷们什么事都不愿意做，那就由我来替他们做主。我决定把那些空出来的中等职位，塞给几个还算听话的斯拉夫人。让他们去管那些低贱的斯拉夫牲畜，去榨干他们最后一滴血汗。\n\n只要他们还能像猎犬一样为我摇尾，我不介意施舍几块骨头。"
MCW_main_story.9.a: "让劣等种族去管理劣等种族，这才是真正的秩序！"

MCW_main_story.10.t: "致梅德韦杰夫"
MCW_main_story.10.d: "梅德韦杰夫元帅：\n\n您不认识我。但您一定听说过我的名字——那个替德国人收税、征粮、指认游击队员的叛徒。没错，就是我。\n\n我今天写这封信，不是为了狡辩。我做过的事，我自己清楚。我只是想告诉您一件事：德国人要杀我了。名单已经拟好，我的名字在上面。他们用完了我，现在要清理掉这块用脏了的抹布。\n\n我只有一条路可走。\n\n我知道德国人的指挥部在哪里，知道弹药库的守卫换班时间，知道通讯线路的走向，知道哪些官员是可以收买的。这些年我替他们做事，也替自己留了一双眼睛。这些情报，我现在可以给您。\n\n我求您让我证明，我还有用。让我当您的内应，让我亲手把那些德国人卖给我的东西，一件一件还给他们。\n\n如果您觉得我还有点价值的话，那么我们不妨找个时间会面谈谈。您是唯一能救我的人。也是唯一能让我死得有点价值的人，求你了将军，就当为了俄罗斯，为了无所不能的主，请宽恕我吧....\n\n此信阅后即焚。"
MCW_main_story.10.a: "一个叛徒想和我们合作？见鬼去吧！"
MCW_main_story.10.b: "或许，他可以将功补过。"

MCW_main_story.11.t: "会面"
MCW_main_story.11.d: "午夜。城外东正教墓园，老礼拜堂。\n\n门推开，戈尔巴乔夫走进来。烛光昏暗，梅德韦杰夫坐在长椅上，大衣领子立着，身边站着两个人。\n\n“元帅。”\n\n梅德韦杰夫站起来，走到他面前，二话不说，抬手就是一耳光。\n\n啪的一声，在空荡荡的礼拜堂里格外清脆。戈尔巴乔夫被打得偏过头去，嘴角渗出血丝，整个人愣在原地。\n\n“这一下，是为前几天博罗沃耶村饿死的三十七个人打的。”梅德韦杰夫声音低沉，“你替德国人干了几年？手上沾了多少血，你自己清楚！。”\n\n戈尔巴乔夫没擦嘴角的血，慢慢转回头，垂下眼睛。\n\n“我知道。我都知道。”他声音发涩，“可德国人要杀我了，名单上有我的名字。将军，我没别的地方可去了。您打我骂我、枪毙我，都行。只求您让我死之前，替你们做点事。让我把欠的债，一笔一笔还回去。”\n\n他低着头，像等着宣判。\n\n梅德韦杰夫盯着他看了半晌，没再动手。"
MCW_main_story.11.a: "“先说说你知道的。说仔细了，我再决定要不要让你活着走出去。”"

MCW_main_story.12.t: "清剿之后"
MCW_main_story.12.d: "清剿是在拂晓前结束的。\n\n村子不大，二十来户人家，土坯房沿着一条泥路排开。党卫军的人天没亮就摸进来，挨家挨户踹开门，把人赶到打谷场上集中。反抗的在当场就被打死了，剩下的大多是老人、妇女和孩子，蹲在寒风中瑟瑟发抖。\n\n天亮之后，搜查队开始在废墟里翻找。\n\n一个士兵踢开一扇歪斜的木门，屋里一片狼藉，灶台上的锅被掀翻了，黑乎乎的汤水流了一地。他扫了一眼，正要转身出去，余光瞥见墙角一堆干草微微动了一下。他端起步枪，走过去，用枪管挑开草堆。\n\n下面蜷着一个中年男人，腹部中了一枪，血已经把半边衣服浸透了。他脸色苍白，嘴唇哆嗦着，看见枪口，下意识举起双手，嘴里含混地说着什么，大概是求饶。\n\n士兵回头喊了一声：“这儿有一个活的。”\n\n另一个士兵走过来，低头看了看，面无表情地抬起手枪，对准男人的眉心开了一枪。声音很闷，在狭窄的屋子里回荡了一下就消散了。两人没有多停留，转身出去，继续检查下一间屋子。\n\n类似的场景在各个角落重复上演。\n\n有人在菜窖里被发现，一家三口挤在一起，母亲死死捂住孩子的嘴，不让他发出声音。手电筒的光照下去的时候，女人的眼睛里满是恐惧。士兵犹豫了一瞬，回头看了一眼带队的小队长。小队长靠在门框上抽烟，点了点头。\n\n三声枪响。\n\n有人在牲口棚的干草垛里被揪出来，是个半大小子，腿上挨了一刀，跑不动了，被拖到院子当中跪下。他低着头，不说话，也不求饶。士兵检查了他的手掌，有握枪磨出的老茧，于是判定是游击队员。又是一枪。\n\n也有人侥幸躲了过去。一个老头躺在自家炕上，浑身发抖，看起来病得很重，连话都说不出来。带队的军官看了他一眼，摆了摆手，意思是没必要浪费子弹。士兵收了枪，跟着队伍撤了出去。\n\n到中午的时候，村子里已经没有活人的动静了。\n\n几具尸体被拖到村口的土坑边，并排码好。没有人统计具体数字，也没有人记录姓名。负责善后的士兵往尸体上浇了一桶煤油，划了根火柴扔上去。火焰腾起来的时候，黑烟滚滚地升上半空，几里地外都能看见。\n\n带队的军官站在不远处，看了看怀表，在笔记本上记了一笔：“村庄清剿完毕，目标区域已肃清。”\n\n然后他合上本子，挥了挥手，队伍集合，沿着来时的路撤了回去。身后的村庄仍在燃烧，没有人回头看一眼。\n\n他所不知道的是"
MCW_main_story.12.a: "在前方的密林里，一把老旧的步枪已经上膛"

MCW_main_story.13.t: "新兵训练"
MCW_main_story.13.d: "新兵训练的第四周，天没亮就被拉上了卡车。开了将近一个小时，停在一片林间空地。沟边蹲着十几个人——有老人，有女人，还有一个十来岁的孩子。双手反绑，衣服破烂，脸上沾着泥和血。\n\n教官转过身，语气平淡得像在布置训练科目：“这些是游击队的家属，窝藏抵抗分子，给游击队送粮食。按照专员辖区的法令，就地处置。”\n\n他叫了第一个名字。弗里茨，十六岁。\n\n弗里茨走上前，接过卡宾枪，手指碰到扳机护圈时像被烫了一下。他拉栓，上膛，抬枪，瞄准——枪口在晃。准星在那个中年男人和老妇人之间来回摆动，怎么也定不住。呼吸越来越急，额头上全是汗。\n\n教官站在他身后，没催。\n\n等了大概十秒钟。“开枪。”\n\n弗里茨扣下扳机。第一枪打高了，削断了一根树枝，落叶纷纷落下。教官没骂他，伸手帮他重新校准了姿势，压低了枪口。“再来一次。”第二枪击中了一个中年男人的胸膛。那人闷哼一声，向后仰倒，抽搐了两下，不动了。\n\n教官点了点头，把枪还给他，转身面向其余新兵：“下一个。”\n\n枪声间隔均匀地响起来。一个接一个，沟边的人陆续倒下去。\n\n到第七个新兵的时候，那个孩子还活着。他缩在一具女尸旁边，浑身发抖，但没有哭。新兵端着枪瞄了很久，准星对着孩子的胸口，手指搭在扳机上，迟迟没有扣下去。手心全是汗，呼吸越来越重。\n\n教官站在三步之外，说了一句：“他长大以后，也会拿起枪的。”\n\n新兵闭上眼睛，扣下了扳机。\n\n枪声过后，林间恢复了寂静。硝烟缓缓散去，沟里不再有任何动静。教官看了看怀表，在记录本上写了一笔，抬起头：“今天的课到此为止。交了枪，上车。”\n新兵们默默交回武器，爬回卡车。有人扶着车厢板弯下腰干呕了几声，什么都没吐出来。弗里茨坐在角落里，两只手搁在膝盖上，盯着自己的指尖，一动不动。"
MCW_main_story.13.a: "“那真的是我们的敌人吗？”"

MCW_main_story.14.t: "围剿之后"
MCW_main_story.14.d: "村子很小，十几户人家散落在一条土路两旁。德国人进村的时候是午后，大部分男人都在地里干活，留在屋里的只有女人、孩子和老人。\n\n士兵们没有费什么功夫。挨家挨户踹开门，把人赶到村口的打谷场上。一个年轻的军官站在场中央，手里拿着根烟，慢慢抽完，把烟头踩灭，才开口说话。\n\n“游击队在哪儿？”\n\n没有人回答。几十个人挤在一起，低着头，没人敢看他。\n\n军官扫了一圈，随手指了一个中年妇女。“你，说。”\n\n女人怀里抱着个婴儿，脸色蜡黄，嘴唇哆嗦着摇了摇头。军官没有追问，朝旁边的士兵扬了扬下巴。士兵走过去，一把从女人怀里夺过孩子。婴儿哇地哭了起来，声音尖锐，在空旷的打谷场上格外刺耳。女人扑上去要抢回来，被另一个士兵按住肩膀，死死钉在原地。\n\n“我再问一遍。”军官的声音依然很平静，“游击队在哪儿？”\n\n女人盯着自己的孩子——那个士兵单手拎着婴儿的襁褓，像拎一只小鸡崽，孩子悬在半空中，四肢乱蹬，哭声已经变得嘶哑。女人的眼泪一下子就涌了出来，嘴唇抖得说不出完整的话。\n\n“我……我真的不知道……他们从来不告诉我们……”\n\n军官看了她一会儿，点了点头，示意士兵把孩子还给她。然后他走到人群前面，蹲下来，平视着蹲在最前面的一个老人。\n\n“老人家，你活了这么大岁数，应该知道什么话该说，什么话不该说。”他的语气甚至称得上温和，“我不为难你。你告诉我游击队在哪，我保证不烧你们的房子，不碰你们的女人。你不说——”\n\n他回头看了一眼身后的士兵。士兵们端起了枪，对准了人群。\n\n老人干枯的手指攥着膝盖上的裤腿，指节发白。他张了张嘴，浑浊的眼球转了转，最后终于挤出一句话：“……东边……东边那片桦树林里……他们有时候会在那儿歇脚……”\n\n军官听完，站起身来，拍了拍手上的灰，对身边的副官交代了几句。然后他转过身，对着打谷场上的人群，声音不大，但每个人都听得清清楚楚。\n\n“早说不就没事了。”\n\n他挥了挥手，士兵们收了枪，列队向东开拔。队伍走出村口的时候，有人回头看了一眼——打谷场上的人们仍然挤在一起，没有人动，没有人说话，只有那个婴儿还在哭。"
MCW_main_story.14.a: "“记下来，在树林里埋上地雷”"

