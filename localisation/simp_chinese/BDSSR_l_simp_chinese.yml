 #wrs-IDEA
 WRS_backstage_battlefield: "敌后的阵线"
 WRS_backstage_battlefield_desc: "西俄罗斯战争结束后，革命阵线已经走到了山穷水尽的地步。我们被迫一路向北撤退，最终缩进了北极圈内的极寒冻土之上。那里没有补给，没有援军，弹药打一发少一发。脚下的土地终年封冻，这里连土豆都种不活。战士们只能靠心里那点信仰，硬扛着现实的饥饿与严寒。\n\n可就在最近，我们成功联系上了AA线另一侧仍在坚持抵抗的莫斯科游击队。信号断断续续，消息零零碎碎，但拼凑出来的状况让人沉默——他们的处境比我们还要艰难几百倍。缺粮、缺药、缺弹药，还要应付德国人一轮接一轮的清剿，几乎是在用血肉之躯堵一道不断开裂的堤坝。\n\n我们自己也不宽裕，每一粒粮食、每一颗子弹都得节省。但无论如何，我们必须想办法帮帮那群同志。哪怕只能匀出几箱弹药、几袋干粮、几条药品，也得加紧送去，我们不能让他们孤军奋战。"
 WRS_good_communication: "高效联络"
 WRS_good_communication_desc: "在经历了一系列没完没了的扯皮和暗中塞出去的贿赂之后，我们总算把和游击队之间的联系通道给打通了。过程谈不上体面，中间人换了好几个，有人嫌风险太高撂挑子不干，有人坐地起价临时加码，还有人拿了钱之后消失得无影无踪，害得我们不得不从头再来一遍。\n\n在经历了一系列困难之后，我们终于与游击队建立了，一套相对于可靠的补给网络，虽然那些中间人视财如命，但是他们好歹效率不错，在付出了应有的定金之后，步枪等装备总会稳稳当当的送在游击队手中。"
