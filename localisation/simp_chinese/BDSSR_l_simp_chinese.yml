 WRS_help: "援助被遗忘的同志"
 VCG_help: "援助古比雪夫"
 VCG_help_desc: "\n\n\n£GFX_VCG_dec_gui_header\n\n\n\n\n\n我们在莫斯科的胜利，迅速在西俄罗斯各地引发连锁反应。首当其冲的便是古比雪夫的工人阶级——他们受到我们的鼓舞，发动了声势浩大的起义，誓言推翻叛徒的统治。\n\n当然，我们目前的处境也不算乐观，但援助古比雪夫的工人同志至关重要。无论出于地缘政治的考量，还是基于革命的情谊，我们都不能让他们孤军奋战。"
