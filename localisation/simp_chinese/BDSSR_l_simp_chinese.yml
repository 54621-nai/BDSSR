 SWP_fxxk_samara_desc: "叛徒弗拉索夫曾经是祖国的一名陆军中将，在伟大的卫国战争中被德国人俘获。然而与其他宁死不屈的苏联英雄不同，弗拉索夫反倒是背叛了苏维埃祖国，转身与德国人勾连，成立了所谓的俄罗斯解放军，长期负责莫斯科专员辖区的治安工作，心甘情愿的给德国人当狗。\n\n在西俄罗斯战争结束过后，他带领手下的俄罗斯伪军盘踞于萨马拉地区，仗着手上有几根枪杆子，便肆无忌惮的欺压人民，无恶不作。而现在也是时候让我们将这群叛徒送上绞刑架了！"
