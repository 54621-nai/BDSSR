 VCG.1.t: "紧急报告"
 VCG.1.desc: "那是一个宁静得近乎虚伪的清晨，梅德韦杰夫正惬意地盘算着早餐的滋味。正当他的思绪还沉浸在腌猪肉的咸香与伏特加的辛辣交织的幻梦中时，一名传令兵如一阵狂风般粗暴地撞开房门，不由分说地拽起他的手，将他一把拉入未知的漩涡。\n在传令兵的牵引下，梅德韦杰夫跌跌撞撞地冲入通讯中心。十几部电台正发出如群蜂般疯狂的嗡鸣，那刺耳的电流声仿佛死神的低语。透过通讯兵急促的回答和电报上冰冷的字里行间，梅德韦杰夫拼凑出了一个令人窒息的恐怖真相：整个莫斯考的武装力量正向解放区倾泻而下，发动全面的进攻，在这短短的十几分钟里，整个边境的哨站已经被炸的七零八落，整个解放区正在生死边缘徘徊。\n时间已如指间沙般流逝，不容半点迟疑。全面动员的计划书已然起草完毕，内容包括解封重武器、将各游击队整编入正规军的序列。而最核心的杀招，是对保卢斯堡发起雷霆般的全面进攻。既然德国人妄图用一场全面的围剿将他们彻底抹除，那他就索性把察里津当作一枚重磅筹码，狠狠丢在莫斯科的作战桌上。他倒要看看，那帮坐在高位的容克老头子，究竟是宁愿让整个南方彻底陷入无政府状态的炼狱，还是仅仅打算像丢弃垃圾一样，送走一批无足轻重的异见分子。\n仅仅是一根烟燃尽的功夫，梅德韦杰夫便接过笔，以决绝的姿态，重重签下了自己的大名。"
 VCG.1.a: "“把预备队全部丢到察里津！”"

