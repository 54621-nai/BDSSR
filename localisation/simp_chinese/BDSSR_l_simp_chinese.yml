 SWP_union_of_workers: "团结的工人"
 SWP_union_of_workers_desc: "古比雪夫是西俄罗斯地区最大的工业中心，一条条精密的流水线和成套的重型设备排列在厂房之中，撑起了这片区域的工业命脉。然而，与这些冰冷的机器形成鲜明对比的，是工人的待遇——简直连猪狗都不如。放眼整个俄罗斯恐怕也只有雅利安兄弟会旗下的奴隶营能与之“媲美”。\n\n正因如此，古比雪夫的工人斗争也是最激烈、最悲壮的。在一次又一次血与泪的教训之后，工人们终于看清了一个事实：那些打着“俄罗斯解放军”旗号的叛徒，永远不会真正改善他们的处境。于是，他们不再寄望于任何人的施舍，而是选择自己团结起来，攥紧拳头，立下誓言——要将俄罗斯解放军的头目，连同这个罪恶的名号，一并送上历史的审判台"
 SWP_fxxk_samara: "铲除俄奸"
 SWP_fxxk_samara_desc: "叛徒弗拉索夫曾经是祖国的一名陆军中将，在伟大的卫国战争中被德国人俘获。然而与其他宁死不屈的苏联英雄不同，弗拉索夫反倒是背叛了苏维埃祖国，转身与德国人勾连，成立了所谓的俄罗斯解放军，长期负责莫斯科专员辖区的治安工作，心甘情愿的给德国人当狗。\n\n在西俄罗斯战争结束过后，他带领手下的俄罗斯伪军盘踞于古比雪夫地区，仗着手上有几根枪杆子，便肆无忌惮的欺压人民，无恶不作。而现在也是时候让我们将这群叛徒送上绞刑架了！"
 SWP_good_friends: "布尔什维克的援助"
 SWP_good_friends_desc: "“你们对于你们实际上所能得到的给予你们的帮助，了解得不十分正确，我们……负责供给百辆汽车，并保证提供司机和所需的汽油，以便来回两次将货物运送到你们指定的地点。但货物并不像你们过去日子来电所要求的那样多，它大约有几十至几百吨重左右，其中没有飞机和重炮。你们必须派遣足够数量的武装部队到古比雪夫边境来接收货物和担负沿途保护的责任。”" 
