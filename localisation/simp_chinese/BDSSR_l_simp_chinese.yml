 VCG_main_story.1.t: "紧急报告"
 VCG_main_story.1.d: "那是一个宁静得近乎虚伪的清晨，梅德韦杰夫正惬意地盘算着早餐的滋味。正当他的思绪还沉浸在腌猪肉的咸香与伏特加的辛辣交织的幻梦中时，一名传令兵如一阵狂风般粗暴地撞开房门，不由分说地拽起他的手，将他一把拉入未知的漩涡。\n在传令兵的牵引下，梅德韦杰夫跌跌撞撞地冲入通讯中心。十几部电台正发出如群蜂般疯狂的嗡鸣，那刺耳的电流声仿佛死神的低语。透过通讯兵急促的回答和电报上冰冷的字里行间，梅德韦杰夫拼凑出了一个令人窒息的恐怖真相：整个莫斯考的武装力量正向解放区倾泻而下，发动全面的进攻，在这短短的十几分钟里，整个边境的哨站已经被炸的七零八落，整个解放区正在生死边缘徘徊。\n时间已如指间沙般流逝，不容半点迟疑。全面动员的计划书已然起草完毕，内容包括解封重武器、将各游击队整编入正规军的序列。而最核心的杀招，是对保卢斯堡发起雷霆般的全面进攻。既然德国人妄图用一场全面的围剿将他们彻底抹除，那他就索性把察里津当作一枚重磅筹码，狠狠丢在莫斯科的作战桌上。他倒要看看，那帮坐在高位的容克老头子，究竟是宁愿让整个南方彻底陷入无政府状态的炼狱，还是仅仅打算像丢弃垃圾一样，送走一批无足轻重的异见分子。\n仅仅是一根烟燃尽的功夫，梅德韦杰夫便接过笔，以决绝的姿态，重重签下了自己的大名。"
 VCG_main_story.1.a: "“把预备队全部丢到察里津！”"
 VCG_main_story.30.t: "急电"
 VCG_main_story.30.d: "凌晨，莫斯科陷入一片静寂，大多数人都沉浸在睡梦之中，直到一封电报打破了这种宁静？译电员几乎是撞开门的，整个人冲进来，声音在安静的走廊里炸开：“司令员同志！古比雪夫！古比雪夫的工人起义了！他们占领了火车站和电报局，正在围攻弗拉索夫的指挥部！”\n\n梅德韦杰夫手里的铅笔啪地掉在了地图上。\n\n他猛地抬起头，瞳孔骤缩，整个人像被电击了一样僵在原地。他盯着译电员看了足足两秒钟，然后一把抓过那张电报，凑到灯下。他的目光飞快地扫过每一个字，扫完一遍，又从头扫了一遍。第三遍还没看完，他突然狠狠地攥紧了那张纸，指节发白，纸张在掌心皱成一团。\n\n“好啊。”他说，声音不大，却带着一股压不住的颤抖，“好得很。”\n\n他把那团电报往桌上一拍，扫了一圈屋里的部下，嗓门陡然拔高：“听见没有？古比雪夫的工人同志们动手了！弗拉索夫那帮叛徒的狗头，马上就要被挂在电线杆上了！”\n\n他大步走到墙上挂着的态势图前，一巴掌拍在地图上，震得图面簌簌作响："
 VCG_main_story.30.a: "“还愣着干什么？快把同志们叫过来！”"

