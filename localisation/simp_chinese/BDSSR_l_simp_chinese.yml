l_simp_chinese:
 communist_military_communism_subtype: "军事共产主义"
 communist_military_communism_subtype_desc: "当军政的铁腕与共产主义的信仰被强行熔铸在一起时，世人的脑海中往往会条件反射般浮现出“枪指挥党”的森冷画面——正如西俄罗斯革命阵线那般，党政的诉求在隆隆的炮火前全面退让。在这片土地上，人们只向手握重兵的军事主官献上忠诚（而他往往也兼任着苏维埃主席的职位），文官政府则在枪杆子的阴影下瑟瑟发抖，彻底沦为只会随声附和的拍手机器。崇高的意识形态被“保家卫国”的战时宣传无情淹没，权力的权杖只能在几个骄横的军头手中来回流转。\n诚然，这不过是一个披着社会主义外衣的军政府，但梅德韦杰夫与他那些“亲戚”们有着本质的区别。尽管同样身处“枪指挥党”的泥沼，他并不是莫斯科的凯撒，而是辛辛纳图斯。他一遍又一遍地向世人宣告，眼前的铁腕统治不过是权宜之计；当战火的硝烟散尽、一切尘埃落定，他自会将权柄双手奉还给一个稳定的文官政府。然而，凝视着眼前这片晦暗未知、深不见底的局势泥沼，又有谁能拨开迷雾说清，这漫天的尘埃究竟该以何种姿态落定，又将在哪一个遥不可及的黎明落定？"
