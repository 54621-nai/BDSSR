l_simp_chinese:
 communist_military_communism_subtype: "军事共产主义"
 communist_military_communism_subtype_desc: "当军政的铁腕与共产主义的信仰被强行熔铸在一起时，世人的脑海中往往会条件反射般浮现出“枪指挥党”的森冷画面——正如西俄罗斯革命阵线那般，党政的诉求在隆隆的炮火前全面退让。在这片土地上，人们只向手握重兵的军事主官献上忠诚（而他往往也兼任着苏维埃主席的职位），文官政府则在枪杆子的阴影下瑟瑟发抖，彻底沦为只会随声附和的拍手机器。崇高的意识形态被“保家卫国”的战时宣传无情淹没，权力的权杖只能在几个骄横的军头手中来回流转。\n诚然，这不过是一个披着社会主义外衣的军政府，但梅德韦杰夫与他那些“亲戚”们有着本质的区别。尽管同样身处“枪指挥党”的泥沼，他并不是莫斯科的凯撒，而是辛辛纳图斯。他一遍又一遍地向世人宣告，眼前的铁腕统治不过是权宜之计；当战火的硝烟散尽、一切尘埃落定，他自会将权柄双手奉还给一个稳定的文官政府。然而，凝视着眼前这片晦暗未知、深不见底的局势泥沼，又有谁能拨开迷雾说清，这漫天的尘埃究竟该以何种姿态落定，又将在哪一个遥不可及的黎明落定？"
 MGG_Yevgeny_Kulchitsky: "叶夫根尼·库尔奇茨基"
 MTL_Nicolay_Kuznetsov: "尼古拉·库兹涅佐夫"
 MTL_Nicolay_Kuznetsov_d: ""

 RBL_Pyotr_Masherov: "彼得·马舍罗夫"
 RBL_Pyotr_Masherov_d: "如果你在20多年前走进白俄罗斯的一所学校，或许会遇到一位名叫彼得·马舍罗夫的老师。但现在，你在莫斯科专员辖区也能听到这个名字——不过不是从学生嘴里，而是从那些穷凶极恶的党卫军口中。\n\n在那场将旧世界彻底碾碎的战争中，白俄罗斯在德军的铁蹄下迅速沦陷。马舍罗夫没有随大流向东撤离，而是就地组织起游击队，与德军周旋。几年下来，他麾下的队伍发展到数万之众。\n\n西俄罗斯战争爆发后，马舍罗夫奉命率部在白俄罗斯与莫斯科的交界地带主动出击，接应红军部队。\n\n然而，西俄革命阵线全线溃败。马舍罗夫不得不带领游击队向东转移，最终退入莫斯科专员辖区。专员辖区派出普莱斯考的党卫军前来镇压，但收效甚微。被迫收缩了控制范围，而游击队则在当地站稳了脚跟。\n\n虽然目前游击队的形势不容乐观，但马舍罗夫和他的部下从未放弃希望。只要形势有所好转，他们就会一刻不停地向莫斯科挺进。"
 traits_Masherov: "白罗斯教员"

 TTG_Vadim_Maffosov: "瓦季姆·马特罗索夫"

 VCG_Dmitry_Medvedev: "德米特里·梅德韦杰夫"
 VCG_Dmitry_Medvedev_d: "德米特里·梅德韦杰夫，一个在莫斯科堪称传奇的名字。作为莫斯科境内最大一支游击队“胜利者”的领导人，他在专员辖区几乎是家喻户晓的存在。\n\n早在1941年，德军刚踏入苏联国土，梅德韦杰夫便已开始着手组织游击队，抵抗侵略。他将自己麾下的队伍命名为“胜利者”——Pobediteli，意在激励每一个战士：有朝一日，他们必将击退入侵者，收复失地，光复苏维埃祖国。\n\n作为一名前契卡成员，梅德韦杰夫对敌后侦察、情报收集、反围剿这一系列游击战所必不可少的战术，堪称驾轻就熟。正是凭借着这身过硬的本事，原本分散在苏联沦陷区各处、各自为战的游击小组，被他大大小小整合起来，捏成了一股不可忽视的力量。\n\n西俄罗斯战争时期，梅德韦杰夫率领“胜利者”加入叶戈罗夫的西俄革命阵线，与纳粹正面交锋。然而，随着革命阵线最终折戟莫斯科城下，他不得不重新回到孤身抗敌的岁月。\n\n情形之艰难，弹药之稀少，粮食之匮乏，难以尽述......但他始终要求自己和部下坚信——\n\n§R胜利一定会到来。§!\n\n§V总有一天，他们能看到祖国被光复的那一天。§!\n\n§x总有一天，他们能彻底消灭流窜在这片土地上的法西斯分子。§!\n\n§e总有一天....总有一天！§!"
 traits_Medvedev: "特勤大元帅"

 SWP_Grigory_Isayev: "格里戈里•伊萨耶夫"
 #SWP_Boris_Mikhailovich_Gunko_d: "如果说鲍里斯.米哈伊洛维奇.贡科没有什么梦想，那是假的，但他万万没想到事情却能发展成今天这样。\n\n在俄罗斯解放军那群叛徒攻占萨马拉之前，鲍里斯的生活一直都非常平常，他在政府的基层行政机构中担任小职员，当然，作为一个诗人，他在闲暇的时候也会创作许多关于沦陷的祖国之类的诗篇。\n\n然而，随着西俄罗斯战争的爆发，革命阵线的工作越发严峻起来，又随着阵线兵败如山倒，弗拉索夫的俄罗斯解放军占领了萨马拉，不过鲍里斯倒是好运，没有像其他留在萨马拉的文官一样被那群叛徒枪毙，而是被发配到了一个工厂，担任最底层的工人。\n\n当然，对于萨马拉那群叛徒来说，工人只不过是一群没有感情的生产工具，也自然不会给他们什么好的待遇。于是，在工厂中，鲍里斯融入了工人之中，并在其组建了一个非法的公会，最初他们只是用停工来表达抗议，但随着敌人的手段越发严厉，鲍里斯认为普通的手段已经无法抗衡敌人了，于是，他用一本来自东方的红色书籍，组织起了工人，同时又与莫斯科的游击队暗中联系，获取一些军事装备，终于在游击队在莫斯科取得胜利的情况下，鲍里斯决定率领工人，进行一场起义，一场革命。\n\n对于鲍里斯与工人来说，为了这场革命，他们已经容忍了太久，为了自由，他们愿意奉上自己的一切，甚至生命。"
